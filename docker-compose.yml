services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nandi
      POSTGRES_PASSWORD: nandi
      POSTGRES_DB: nandi
    ports:
      - "5432:5432"
    volumes:
      - nandi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nandi -d nandi"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.20.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - nandi_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nandi_postgres_data:
  nandi_qdrant_data:
